<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Registros Financeiros</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/gestao.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
    <div class="content">
        <section class="first-line">
            <div class="container">
                <div class="boxbig">
                    <div class="first">
                        <div class="first-line">
                            <p></p>
                            <span class="material-symbols-outlined" style="color: #e5d1a6;">arrow_shape_up</span>
                        </div>
                        <div class="second-line">
                            <p></p>
                        </div>
                    </div>
                    <div class="second">
                        <div class="card">Jan</div>
                        <div class="card">Fev</div>
                        <div class="card">Mar</div>
                        <div class="card">Abr</div>
                        <div class="card">Mai</div>
                        <div class="card">Jun</div>
                        <div class="card">Jul</div>
                        <div class="card">Ago</div>
                        <div class="card">Set</div>
                        <div class="card">Out</div>
                        <div class="card">Nov</div>
                        <div class="card">Dez</div>
                    </div>
                </div>
                <div class="box">
                    <div class="first">
                        <img src="../IMAGES/Subida.png">
                        <p>Renda Mensal</p>
                    </div>
                    <div class="second">
                        <p id="rendaMensal"></p>
                    </div>
                </div>
                <div class="box">
                    <div class="first">
                        <img src="../IMAGES/down.png">
                        <p>Despesa Mensal</p>
                    </div>
                    <div class="second">
                        <p id="despesaMensal"></p>
                    </div>
                </div>
                <div class="box-first-one">
                    <div class="first">
                        <span class="material-symbols-outlined">account_balance</span>
                        <p>Saldo Atual</p>
                    </div>
                    <div class="second">
                        <p id="saldoAtual"></p>
                    </div>
                </div>
            </div>
        </section>
        <section class="second-line">
            <div class="container">
                <div class="box">
                    <div class="box-content">
                        <div class="first-gestao boxing">
                            <h1>Movimentações</h1>
                            <div class="all-cards" id="colunaMovimentacoes">
                            </div>
                            <button>Adicionar Movimentação</button>
                        </div>
                        <div class="second-gestao boxing">
                            <h1>Rendas</h1>
                            <div class="all-cards" id="colunaRendas">
                            </div>
                            <button>Adicionar Renda</button>
                        </div>
                        <div class="third-gestao boxing">
                            <h1>Despesas</h1>
                            <div class="all-cards" id="colunaDespesas">
                            </div>
                            <button>Adicionar Despesa</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="third-line">
            <div class="container">
                <div class="boxbig">
                    <div class="user">
                        <div class="icon">
                            <p id="usuarioIcon"></p>
                        </div>
                        <div class="name">
                            <p class="first-name" id="usuarioName"></p>
                            <p class="second-name">Planejador Financeiro</p>
                        </div>
                    </div>
                    <div class="cards">
                        <div class="icon" onclick="window.location.href='../HTML/index.html'">
                            <span class="material-symbols-outlined">home</span>
                        </div>
                        <div class="icon" onclick="window.location.href='../HTML/gestao.html'">
                            <span class="material-symbols-outlined">supervisor_account</span>
                        </div>
                        <div class="icon">
                            <span class="material-symbols-outlined">settings</span>
                        </div>
                    </div>
                </div>
                <div class="box"></div>
            </div>
        </section>
    </div>
    <script src="../JS/gestao.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="../JS/charts/categorias.js"></script>
</body>

</html>
